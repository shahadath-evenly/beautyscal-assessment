server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML entry point must never be cached, or clients keep loading an
    # old build that references deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page application: unknown paths are client-side routes, so they
    # fall back to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
