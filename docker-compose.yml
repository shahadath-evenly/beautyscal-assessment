# Whole stack: PostgreSQL, the Go API and the built React client.
#
#   cp .env.example .env
#   docker compose up -d --build postgres api   database and API
#   docker compose run --rm api seed            load the demo data, prints IDs
#   # paste the printed IDs into VITE_WORKSPACES in .env, then:
#   docker compose up -d --build web            client on http://localhost:5173
#
#   docker compose down                         stop, keeping the data volume
#   docker compose down -v                      stop and discard the data
#
# The seed step comes before the client build on purpose: Vite inlines
# VITE_* values at build time, and the workspace IDs are generated by the
# database, so they cannot be known before the seed runs. See the README.
#
# backend/docker-compose.yml and frontend/docker-compose.yml still run each
# app on its own; this file is the one that brings up everything together.

name: beautyscale

services:
  postgres:
    image: postgres:17-alpine
    container_name: beautyscale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bscale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bscale}
      POSTGRES_DB: ${POSTGRES_DB:-bscale_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Published on 5433: a local PostgreSQL commonly already holds 5432 on
      # the host. Inside this network the port is still 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The explicit user and database avoid a false "ready" during initdb,
      # when the server briefly accepts connections and then restarts.
      test:
        [
          "CMD-SHELL",
          "pg_isready -q -U ${POSTGRES_USER:-bscale} -d ${POSTGRES_DB:-bscale_dev}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beautyscale-api
    restart: unless-stopped
    environment:
      APP_ENV: docker
      HTTP_PORT: "8081"
      # The API reaches PostgreSQL by the Compose service name, never
      # localhost. Built from the POSTGRES_* values above so credentials stay
      # in sync. DATABASE_URL from .env is deliberately not used here: it
      # points at the host, which is meaningless inside a container. Set
      # DOCKER_DATABASE_URL to override.
      DATABASE_URL: >-
        ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-bscale}:${POSTGRES_PASSWORD:-bscale}@postgres:5432/${POSTGRES_DB:-bscale_dev}?sslmode=disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # The origin the browser loads the client from.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-1}
      # Email is optional. With no key the API logs the message instead of
      # sending it, which is what the assessment asks for.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-BeautyScale}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        # The API pings the database at startup and exits non-zero if it is
        # unreachable, so it must not start first.
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines VITE_* values at build time, so these are build
        # arguments, not runtime variables. The URL must be the one the
        # BROWSER uses, which is a host address: a Compose service name would
        # not resolve outside Docker.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
        # The demo workspace list. Without it the image ships a switcher with
        # no options, so run the seed first and paste its output here.
        VITE_WORKSPACES: ${VITE_WORKSPACES:-}
    container_name: beautyscale-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  postgres-data:
    name: beautyscale-postgres-data
