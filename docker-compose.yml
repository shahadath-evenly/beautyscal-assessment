# Backend stack: PostgreSQL and the Go API. Self-contained and independent of
# the frontend. Environment values are read from ./.env
#
#   docker compose up --build        start the database and API
#   docker compose run --rm api seed run the seed command
#   docker compose down             stop, keeping the database volume

name: beautyscale-backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: beautyscale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beautyscale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beautyscale}
      POSTGRES_DB: ${POSTGRES_DB:-beautyscale}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Published on 5433: a local PostgreSQL already holds 5432 on the host.
      # Inside this Compose network the port is still 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The explicit user and database avoid a false "ready" during initdb,
      # when the server briefly accepts connections and then restarts.
      test:
        [
          "CMD-SHELL",
          "pg_isready -q -U ${POSTGRES_USER:-beautyscale} -d ${POSTGRES_DB:-beautyscale}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beautyscale-api
    restart: unless-stopped
    environment:
      APP_ENV: docker
      HTTP_PORT: "8081"
      # The API reaches PostgreSQL by the Compose service name, never
      # localhost. Built from the POSTGRES_* values above so credentials stay
      # in sync. DATABASE_URL in .env is deliberately NOT used here: it points
      # at the host, which is meaningless inside a container. Set
      # DOCKER_DATABASE_URL to override.
      DATABASE_URL: >-
        ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-beautyscale}:${POSTGRES_PASSWORD:-beautyscale}@postgres:5432/${POSTGRES_DB:-beautyscale}?sslmode=disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # The frontend runs separately; its origin must be allowed here.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-1}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        # The API pings the database at startup and exits non-zero if it is
        # unreachable, so it must not start first.
        condition: service_healthy
    extra_hosts:
      # Allows reaching a database running on the host, if DATABASE_URL points
      # at host.docker.internal.
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
    name: beautyscale-postgres-data
